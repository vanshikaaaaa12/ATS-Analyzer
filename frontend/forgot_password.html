<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    overflow:hidden;
}

.container{
    width:400px;
    background:rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    backdrop-filter:blur(15px);
    box-shadow:0px 8px 25px rgba(0,0,0,0.3);
    text-align:center;
    animation:float 3s ease-in-out infinite;
    border:1px solid rgba(255,255,255,0.2);
}

.container h2{
    color:white;
    margin-bottom:10px;
    font-size:35px;
}

.subtitle{
    color:#dcdcdc;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:12px 0;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#007BFF;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
    transform:scale(1.03);
}

a{
    color:#38bdf8;
    text-decoration:none;
    font-weight:bold;
}

a:hover{
    color:white;
}

#msg{
    color:white;
    margin-top:15px;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }

}

</style>

</head>

<body>

<div class="container">

<h2>Forgot Password</h2>

<p class="subtitle">

Reset your ATS Portal password

</p>

<form id="forgotForm">

<input type="email"
id="email"
placeholder="Enter Registered Email"
required>

<input type="password"
id="newPassword"
placeholder="Enter New Password"
required>

<button type="submit">

Update Password

</button>

<p id="msg"></p>

<p style="margin-top:20px; color:white;">

Back to Login?

</p>

<a href="student_login.html">

Login Here

</a>

</form>

</div>

<script>

document.getElementById("forgotForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    let email =
    document.getElementById("email").value;

    let newPassword =
    document.getElementById("newPassword").value;

    fetch("https://ats-portal-backend.onrender.com/students/all")

    .then(res => res.json())

    .then(data => {

        let studentFound = null;

        data.forEach(student => {

            if(student.email === email){

                studentFound = student;

            }

        });

        if(studentFound != null){

            studentFound.password = newPassword;

            fetch("https://ats-portal-backend.onrender.com/students/update", {

    method:"PUT",

    headers:{
        "Content-Type":"application/json"
    },

    body:JSON.stringify(studentFound)

})

            .then(res => res.json())

            .then(data => {

                document.getElementById("msg").innerText =
                "Password Updated Successfully!";

                setTimeout(() => {

                    window.location.href =
                    "student_login.html";

                },2000);

            });

        }

        else{

            document.getElementById("msg").innerText =
            "Email Not Found!";

        }

    });

});

</script>

</body>

</html>
