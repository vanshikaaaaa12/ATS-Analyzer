<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    overflow:hidden;
}

.container{
    width:400px;
    background:rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    backdrop-filter:blur(15px);
    box-shadow:0px 8px 25px rgba(0,0,0,0.3);
    text-align:center;
    animation:float 3s ease-in-out infinite;
    border:1px solid rgba(255,255,255,0.2);
}

.container h2{
    color:white;
    margin-bottom:10px;
    font-size:35px;
}

.subtitle{
    color:#dcdcdc;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:12px 0;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#007BFF;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
    transform:scale(1.03);
}

p{
    margin-top:15px;
    color:white;
}

a{
    color:#38bdf8;
    text-decoration:none;
    font-weight:bold;
}

a:hover{
    color:white;
}

#msg{
    color:white;
    margin-top:10px;
}

.forgot-password{
    display:block;
    margin-top:12px;
    font-size:15px;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }

}

</style>

</head>

<body>

<div class="container">

<h2>Student Login</h2>

<p class="subtitle">

Welcome to ATS Placement Portal

</p>

<form id="loginForm">

<input type="email"
id="email"
placeholder="Enter Email"
required>

<input type="password"
id="password"
placeholder="Enter Password"
required>

<button type="submit">

Login

</button>

<a href="forgot_password.html"
class="forgot-password">

Forgot Password?

</a>

<p id="msg"></p>

<p>Don't have an account?</p>

<a href="student_register.html">

Register Here

</a>

</form>

</div>

<script>

document.getElementById("loginForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    let email =
    document.getElementById("email").value;

    let password =
    document.getElementById("password").value;

    fetch("https://ats-portal-backend.onrender.com/students/all")

    .then(res => res.json())

    .then(data => {

        let found = false;

        data.forEach(student => {

            if(

                student.email.trim().toLowerCase()
                ===
                email.trim().toLowerCase()

                &&

                student.password.trim()
                ===
                password.trim()

            ){

                found = true;

                localStorage.setItem(
                    "studentName",
                    student.name
                );

                localStorage.setItem(
                    "studentEmail",
                    student.email
                );

            }

        });

        if(found){

            document.getElementById("msg").innerText =
            "Login Successful!";

            setTimeout(() => {

                window.location.href =
                "student_dashboard.html";

            },300);

        }

        else{

            document.getElementById("msg").innerText =
            "Invalid Email or Password!";

        }

    })

    .catch(error => {

        document.getElementById("msg").innerText =
        "Backend Connection Error!";

        console.log(error);

    });

});

</script>

</body>

</html>
