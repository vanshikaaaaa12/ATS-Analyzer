<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>View Students</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fc;
}

.navbar{
    width:100%;
    background:#007BFF;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:white;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.nav-links a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:18px;
}

.heading{
    text-align:center;
    margin-top:40px;
}

.heading h1{
    color:#333;
    font-size:42px;
}

.container{
    width:90%;
    margin:40px auto;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0px 5px 15px rgba(0,0,0,0.1);
}

th{
    background:#007BFF;
    color:white;
    padding:15px;
    font-size:18px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;
    color:#333;
}

tr:hover{
    background:#f1f5f9;
}

.footer{
    text-align:center;
    padding:20px;
    background:#007BFF;
    color:white;
    margin-top:40px;
}

</style>

</head>

<body>

<div class="navbar">

<div class="logo">

ATS Admin Panel

</div>

<div class="nav-links">

<a href="admin_dashboard.html">

Dashboard

</a>

<a href="admin_login.html">

Logout

</a>

</div>

</div>

<div class="heading">

<h1>

Registered Students

</h1>

</div>

<div class="container">

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Branch</th>

<th>CGPA</th>

</tr>

</thead>

<tbody id="studentTable">

</tbody>

</table>

</div>

<div class="footer">

<p>

© 2026 ATS Placement Portal |
Developed by Vanshika

</p>

</div>

<script>

fetch("https://ats-portal-backend.onrender.com/students/all")

.then(res => res.json())

.then(data => {

    let table =
    document.getElementById("studentTable");

    data.forEach(student => {

        table.innerHTML += `

        <tr>

            <td>${student.name}</td>

            <td>${student.email}</td>

            <td>${student.branch}</td>

            <td>${student.cgpa}</td>

        </tr>

        `;

    });

});

</script>

</body>

</html>
