<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Applications</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f1f5f9;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:40px;
    color:#0f172a;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:25px;
    border-radius:15px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.08);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.company{
    font-size:28px;
    color:#2563eb;
    margin-bottom:10px;
}

.role{
    font-size:20px;
    color:#334155;
    margin-bottom:10px;
}

.info{
    margin:8px 0;
    color:#475569;
    font-size:17px;
}

.status{
    display:inline-block;
    padding:10px 18px;
    border-radius:30px;
    font-size:16px;
    color:white;
    background:#f59e0b;
    margin-top:15px;
}

.empty{
    text-align:center;
    font-size:22px;
    color:gray;
    margin-top:100px;
}

</style>

</head>

<body>

<h1>My Applications</h1>

<div class="container" id="applicationsContainer">

</div>

<script>

let applications = JSON.parse(
localStorage.getItem("applications")
) || [];

let currentStudent =

localStorage.getItem("studentEmail");

let filteredApplications =

applications.filter(app =>

app.studentEmail === currentStudent

);

let container =
document.getElementById("applicationsContainer");

if(filteredApplications.length === 0){

    container.innerHTML = `

    <div class="empty">

    No Applications Found

    </div>

    `;

}

else{

    filteredApplications.forEach(app => {

        container.innerHTML += `

        <div class="card">

            <div class="company">
            ${app.company}
            </div>

            <div class="role">
            ${app.role}
            </div>

            <div class="info">
            Package : ${app.package}
            </div>

            <div class="info">
            Location : ${app.location}
            </div>

            <div class="status">
            ${app.status}
            </div>

        </div>

        `;

    });

}

</script>

</body>

</html>
