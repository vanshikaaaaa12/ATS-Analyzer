<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    overflow:hidden;
}

.container{
    width:420px;
    background:rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    backdrop-filter:blur(15px);
    box-shadow:0px 8px 25px rgba(0,0,0,0.3);
    text-align:center;
    animation:float 3s ease-in-out infinite;
    border:1px solid rgba(255,255,255,0.2);
}

.container h2{
    color:white;
    margin-bottom:10px;
    font-size:35px;
}

.subtitle{
    color:#dcdcdc;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:12px 0;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#007BFF;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
    transform:scale(1.03);
}

p{
    margin-top:15px;
    color:white;
}

a{
    color:#38bdf8;
    text-decoration:none;
    font-weight:bold;
}

a:hover{
    color:white;
}

#msg{
    color:white;
    margin-top:10px;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }

}

</style>

</head>

<body>

<div class="container">

<h2>Student Registration</h2>

<p class="subtitle">

Create your ATS Portal account

</p>

<form id="registerForm">

<input type="text"
id="name"
placeholder="Full Name"
required>

<input type="email"
id="email"
placeholder="Email"
required>

<input type="password"
id="password"
placeholder="Password"
required>

<input type="text"
id="branch"
placeholder="Branch"
required>

<input type="number"
step="0.01"
id="cgpa"
placeholder="CGPA"
required>

<button type="submit">

Register

</button>

<p id="msg"></p>

<p>Already have an account?</p>

<a href="student_login.html">

Login Here

</a>

</form>

</div>

<script>

document.getElementById("registerForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    let student = {

        name:
        document.getElementById("name").value,

        email:
        document.getElementById("email").value,

        password:
        document.getElementById("password").value,

        branch:
        document.getElementById("branch").value,

        cgpa:
        parseFloat(
        document.getElementById("cgpa").value
        )

    };

    fetch("https://ats-portal-backend.onrender.com/students/add", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(student)

    })

    .then(res => res.json())

    .then(data => {

        document.getElementById("msg").innerText =
        "Registration Successful!";

        setTimeout(() => {

            window.location.href =
            "student_login.html";

        },1000);

    })

    .catch(err => {

        document.getElementById("msg").innerText =
        "Error! Backend not connected.";

    });

});

</script>

</body>

</html>
